<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>チラシ価格トラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>チラシ価格トラッカー</h1>
  <p id="status" class="muted"></p>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="list" aria-selected="true">特売一覧</button>
    <button role="tab" data-tab="compare">店舗比較</button>
    <button role="tab" data-tab="history">価格推移</button>
    <button role="tab" data-tab="campaign">キャンペーン</button>
  </nav>
</header>

<main>
  <div id="filters">
    <input id="q" type="search" placeholder="商品名で検索" aria-label="商品名で検索">
    <label class="check"><input id="active" type="checkbox" checked> 開催中のみ</label>
    <div id="stores" class="chips" aria-label="店舗"></div>
    <div id="categories" class="chips" aria-label="カテゴリ"></div>
  </div>

  <section id="list" class="view">
    <div class="sortbar muted">並び順
      <select id="sort" aria-label="並び順">
        <option value="end">終了が近い順</option>
        <option value="price">安い順</option>
        <option value="name">名前順</option>
      </select>
      <span id="count"></span>
    </div>
    <ul id="items" class="cards"></ul>
  </section>

  <section id="compare" class="view" hidden>
    <p class="muted">同じ商品を扱う店の税込価格を、100gあたり・1個あたりなどの単価にそろえて並べています。単位が揃う場合のみ最安に印を付けます。商品名を押すと推移を表示します。</p>
    <div class="scroll"><table id="compareTable"></table></div>
  </section>

  <section id="history" class="view" hidden>
    <input id="product" list="products" placeholder="商品を選ぶ（入力で絞り込み）" aria-label="商品を選ぶ">
    <datalist id="products"></datalist>
    <div id="chartWrap" hidden>
      <h2 id="chartTitle"></h2>
      <div id="legend" class="legend"></div>
      <div id="chart"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="net"></div>
      <div class="scroll"><table id="historyTable"></table></div>
    </div>
  </section>

  <section id="campaign" class="view" hidden>
    <ul id="leaflets" class="cards"></ul>
  </section>
</main>

<footer class="muted">
  価格はチラシ画像からAIが読み取ったもので、誤りを含むことがあります。購入前に各店のチラシをご確認ください。
  税込表示が無い商品は税率から概算し「約」を付けています。
</footer>
<script src="app.js"></script>
</body>
</html>
